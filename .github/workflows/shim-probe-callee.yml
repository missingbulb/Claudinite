# Temporary probe (design verification for docs/update-flow/DESIGN.md): how a
# caller's `permissions:` ceiling reaches the jobs of a cross-repo reusable
# workflow. Removed once the run is recorded.
name: shim-probe-callee

on:
  workflow_call:
    inputs:
      args:
        required: false
        type: string
        default: ''

jobs:
  narrowed:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - run: |
          echo "CALLEE_MARKER=permissions-probe-v1"
          echo "job=narrowed repo=$GITHUB_REPOSITORY ref=$GITHUB_REF"
  inherits:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "CALLEE_MARKER=permissions-probe-v1"
          echo "job=inherits repo=$GITHUB_REPOSITORY ref=$GITHUB_REF"
