# A ONE-JOB SHIM — the companion to claudinite-scheduler.yml, same reasoning: the
# body lives in the canon at the reusable workflow the `uses:` line names, and
# this file carries only what GitHub will not read from anywhere else. The label
# filter, the secret list and the per-job permissions are all callee-side, so a
# new ready spelling or a newly required secret is an ordinary canon commit
# rather than a fleet-wide human-merged PR.
name: Claudinite executor

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      continuation_depth:
        description: 'How many dead runs this chain has continued through — set by the continuation job below, never by hand'
        required: false
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

jobs:
  executor:
    uses: missingbulb/Claudinite/.github/workflows/claudinite-executor-callee.yml@main
    secrets: inherit
    with:
      continuation_depth: ${{ inputs.continuation_depth }}
      stub_contract: executor/1
