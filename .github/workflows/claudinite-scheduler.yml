# A ONE-JOB SHIM. `.github/workflows/` is the one path a converge cannot push
# into, so anything left here can only be changed by a pull request a human
# merges — in every member repo, one at a time. The body therefore lives in the
# canon, at the reusable workflow the `uses:` line names, where an ordinary canon
# commit changes what every caller runs with this file byte-unchanged.
#
# Nothing member-varying but the cron, and nothing behavioural at all: triggers,
# the permission ceiling (a callee job naming a scope outside it fails the run at
# planning, so widening it is the one change that must come back here), the
# concurrency group, and the call. This copy is the canon's own; the stub every
# member is vendored is the one the tasks pack keeps.
name: Claudinite scheduler

on:
  schedule:
    - cron: '44 5,17 * * *'
  workflow_dispatch:
    inputs:
      wake:
        description: 'Task ids to run now (`pack/task` or a bare task name, space-separated) — wakes each one’s standing item regardless of its anchor'
        required: false
        type: string

concurrency:
  group: claudinite-scheduler-run
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

jobs:
  scheduler:
    uses: missingbulb/Claudinite/.github/workflows/claudinite-scheduler-callee.yml@main
    secrets: inherit
    with:
      wake: ${{ inputs.wake }}
      stub_contract: scheduler/1
